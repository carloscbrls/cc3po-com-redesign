<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="cc3po-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6b35ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cc3po-grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b35ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="1024" fill="#0a0a0b"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  </pattern>
  <rect width="1024" height="1024" fill="url(#grid)"/>
  
  <!-- Radial glow behind -->
  <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#6b35ff;stop-opacity:0.08" />
    <stop offset="100%" style="stop-color:#0a0a0b;stop-opacity:0" />
  </radialGradient>
  <circle cx="512" cy="512" r="400" fill="url(#bg-glow)"/>
  
  <!-- Circuit traces radiating outward -->
  <g stroke="#00d2ff" stroke-width="1.5" fill="none" opacity="0.3" filter="url(#glow)">
    <!-- Top traces -->
    <path d="M 512 200 L 512 120 M 512 120 L 450 80 M 512 120 L 574 80"/>
    <path d="M 350 280 L 280 220 M 280 220 L 220 200"/>
    <path d="M 674 280 L 744 220 M 744 220 L 804 200"/>
    <!-- Bottom traces -->
    <path d="M 512 824 L 512 904 M 512 904 L 450 944 M 512 904 L 574 944"/>
    <path d="M 350 744 L 280 804 M 280 804 L 220 824"/>
    <path d="M 674 744 L 744 804 M 744 804 L 804 824"/>
    <!-- Side traces -->
    <path d="M 200 512 L 120 512 M 120 512 L 80 450 M 120 512 L 80 574"/>
    <path d="M 824 512 L 904 512 M 904 512 L 944 450 M 904 512 L 944 574"/>
  </g>
  
  <!-- Connection nodes on traces -->
  <g fill="#FFD700" opacity="0.6">
    <circle cx="450" cy="80" r="3"/>
    <circle cx="574" cy="80" r="3"/>
    <circle cx="220" cy="200" r="3"/>
    <circle cx="804" cy="200" r="3"/>
    <circle cx="450" cy="944" r="3"/>
    <circle cx="574" cy="944" r="3"/>
    <circle cx="220" cy="824" r="3"/>
    <circle cx="804" cy="824" r="3"/>
    <circle cx="80" cy="450" r="3"/>
    <circle cx="80" cy="574" r="3"/>
    <circle cx="944" cy="450" r="3"/>
    <circle cx="944" cy="574" r="3"/>
  </g>
  
  <!-- First C (left) -->
  <path d="M 340 310 
           C 340 270, 380 240, 430 240 
           L 470 240 
           C 520 240, 540 260, 540 280" 
        stroke="url(#cc3po-grad2)" stroke-width="16" fill="none" stroke-linecap="round" filter="url(#glow-strong)"/>
  <path d="M 340 310 
           L 340 714 
           C 340 760, 380 784, 430 784 
           L 470 784 
           C 520 784, 540 764, 540 744" 
        stroke="url(#cc3po-grad2)" stroke-width="16" fill="none" stroke-linecap="round" filter="url(#glow-strong)"/>
  
  <!-- Second C (right) -->
  <path d="M 484 310 
           C 484 270, 524 240, 574 240 
           L 614 240 
           C 664 240, 684 260, 684 280" 
        stroke="url(#cc3po-grad)" stroke-width="16" fill="none" stroke-linecap="round" filter="url(#glow-strong)"/>
  <path d="M 484 310 
           L 484 714 
           C 484 760, 524 784, 574 784 
           L 614 784 
           C 664 784, 684 764, 684 744" 
        stroke="url(#cc3po-grad)" stroke-width="16" fill="none" stroke-linecap="round" filter="url(#glow-strong)"/>
  
  <!-- The "3" node - central circuit node -->
  <circle cx="512" cy="512" r="24" fill="#0a0a0b" stroke="#FFD700" stroke-width="3" filter="url(#glow-strong)"/>
  <circle cx="512" cy="512" r="10" fill="#FFD700" filter="url(#glow)"/>
  
  <!-- "PO" text below -->
  <text x="512" y="870" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="48" font-weight="800" fill="url(#cc3po-grad)" letter-spacing="8" filter="url(#glow)">CC3PO</text>
  
  <!-- Tagline -->
  <text x="512" y="910" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="400" fill="#55556a" letter-spacing="4">BUILD · RUN · EVOLVE</text>
</svg>