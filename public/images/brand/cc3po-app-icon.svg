<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b35ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="#0a0a0b"/>
  
  <!-- Bold inner border -->
  <rect x="20" y="20" width="472" height="472" rx="92" ry="92" fill="none" stroke="url(#icon-grad)" stroke-width="2"/>
  
  <!-- Circuit "C" shape - bold, simplified for small sizes -->
  <path d="M 310 140 
           C 310 115, 295 100, 270 100 
           L 230 100 
           C 200 100, 180 120, 180 150
           L 180 362
           C 180 392, 200 412, 230 412
           L 270 412
           C 295 412, 310 397, 310 372" 
        stroke="url(#icon-grad)" stroke-width="36" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Central node (the "3" dot) - larger for visibility -->
  <circle cx="256" cy="256" r="28" fill="#0a0a0b" stroke="#FFD700" stroke-width="5"/>
  <circle cx="256" cy="256" r="12" fill="#FFD700"/>
  
  <!-- Top circuit traces -->
  <line x1="256" y1="68" x2="256" y2="36" stroke="#00d2ff" stroke-width="2" opacity="0.5"/>
  <line x1="256" y1="36" x2="216" y2="20" stroke="#00d2ff" stroke-width="2" opacity="0.5"/>
  <line x1="256" y1="36" x2="296" y2="20" stroke="#00d2ff" stroke-width="2" opacity="0.5"/>
  <circle cx="216" cy="20" r="4" fill="#FFD700" opacity="0.7"/>
  <circle cx="296" cy="20" r="4" fill="#FFD700" opacity="0.7"/>
  
  <!-- Bottom circuit traces -->
  <line x1="256" y1="444" x2="256" y2="476" stroke="#00d2ff" stroke-width="2" opacity="0.5"/>
  <line x1="256" y1="476" x2="216" y2="492" stroke="#00d2ff" stroke-width="2" opacity="0.5"/>
  <line x1="256" y1="476" x2="296" y2="492" stroke="#00d2ff" stroke-width="2" opacity="0.5"/>
  <circle cx="216" cy="492" r="4" fill="#FFD700" opacity="0.7"/>
  <circle cx="296" cy="492" r="4" fill="#FFD700" opacity="0.7"/>
  
  <!-- Side circuit traces -->
  <line x1="90" y1="256" x2="58" y2="256" stroke="#6b35ff" stroke-width="2" opacity="0.4"/>
  <line x1="58" y1="256" x2="38" y2="216" stroke="#6b35ff" stroke-width="2" opacity="0.4"/>
  <line x1="58" y1="256" x2="38" y2="296" stroke="#6b35ff" stroke-width="2" opacity="0.4"/>
  <circle cx="38" cy="216" r="4" fill="#FFD700" opacity="0.7"/>
  <circle cx="38" cy="296" r="4" fill="#FFD700" opacity="0.7"/>
  
  <line x1="422" y1="256" x2="454" y2="256" stroke="#6b35ff" stroke-width="2" opacity="0.4"/>
  <line x1="454" y1="256" x2="474" y2="216" stroke="#6b35ff" stroke-width="2" opacity="0.4"/>
  <line x1="454" y1="256" x2="474" y2="296" stroke="#6b35ff" stroke-width="2" opacity="0.4"/>
  <circle cx="474" cy="216" r="4" fill="#FFD700" opacity="0.7"/>
  <circle cx="474" cy="296" r="4" fill="#FFD700" opacity="0.7"/>
</svg>