<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <linearGradient id="dept-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b35ff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#00d2ff;stop-opacity:0.06" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6b35ff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#6b35ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b35ff;stop-opacity:0" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="627" fill="#16161a"/>
  <rect width="1200" height="627" fill="url(#grid)"/>
  
  <!-- Department radial glow -->
  <circle cx="250" cy="313" r="350" fill="url(#dept-grad)"/>
  
  <!-- Top accent border -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#border-grad)"/>
  
  <!-- Left: Agent portrait (placeholder circle) -->
  <circle cx="250" cy="313" r="150" fill="#0a0a0b" stroke="#6b35ff" stroke-width="2" opacity="1"/>
  <circle cx="250" cy="313" r="146" fill="#1c1c22"/>
  <!-- Replace with: <image href="/images/authors/AGENTNAME.png" x="104" y="167" width="292" height="292" clip-path="url(#portrait-clip)"/> -->
  <text x="250" y="330" text-anchor="middle" font-size="60" opacity="0.3">🌍</text>
  
  <!-- Right: Content area -->
  <!-- Department label -->
  <rect x="480" y="150" width="140" height="24" rx="12" fill="rgba(107,53,255,0.15)"/>
  <text x="550" y="167" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#6b35ff" letter-spacing="2">COMMAND</text>
  
  <!-- Agent name -->
  <text x="480" y="230" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="36" font-weight="800" fill="#e8e8ed" letter-spacing="1">ATLAS 🌍</text>
  
  <!-- Role -->
  <text x="480" y="270" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="400" fill="#8888a0">Systems Coordinator</text>
  
  <!-- Description -->
  <text x="480" y="320" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="400" fill="#55556a">
    <tspan x="480" dy="0">Carries the weight of the village so your</tspan>
    <tspan x="480" dy="24">systems never break.</tspan>
  </text>
  
  <!-- Quote -->
  <text x="480" y="410" font-family="'Inter', system-ui, sans-serif" font-size="14" font-style="italic" fill="#55556a">"I calculated the load. It holds."</text>
  
  <!-- Bottom: CC3PO branding -->
  <text x="480" y="540" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="12" font-weight="700" fill="#55556a" letter-spacing="4">CC3PO</text>
  <rect x="480" y="550" width="40" height="1" fill="#6b35ff" opacity="0.4"/>
  <text x="530" y="556" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#55556a" letter-spacing="2">BUILD · RUN · EVOLVE</text>
  
  <!-- Particle decorations -->
  <circle cx="1050" cy="100" r="2" fill="#00d2ff" opacity="0.3"/>
  <circle cx="1100" cy="500" r="1.5" fill="#6b35ff" opacity="0.4"/>
  <circle cx="450" cy="80" r="1" fill="#FFD700" opacity="0.3"/>
  <circle cx="1150" cy="300" r="2" fill="#00d2ff" opacity="0.2"/>
  
  <!-- Connection lines -->
  <line x1="1050" y1="100" x2="1100" y2="500" stroke="#00d2ff" stroke-width="0.5" opacity="0.06"/>
</svg>