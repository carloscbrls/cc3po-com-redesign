<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="dept-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b35ff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#00d2ff;stop-opacity:0.04" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6b35ff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#6b35ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b35ff;stop-opacity:0" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1600" height="900" fill="#0a0a0b"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  
  <!-- Department radial glow -->
  <circle cx="800" cy="450" r="500" fill="url(#dept-grad)"/>
  
  <!-- Top accent border -->
  <rect x="0" y="0" width="1600" height="3" fill="url(#border-grad)"/>
  
  <!-- Department label -->
  <rect x="700" y="80" width="200" height="28" rx="14" fill="rgba(107,53,255,0.15)"/>
  <text x="800" y="99" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#6b35ff" letter-spacing="3">CONTENT STUDIO</text>
  
  <!-- Title -->
  <text x="800" y="200" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="64" font-weight="800" fill="#e8e8ed" letter-spacing="2">Meet Your Digital Team</text>
  
  <!-- Subtitle -->
  <text x="800" y="260" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="400" fill="#8888a0">24 specialists with their own voices, faces, and expertise</text>
  
  <!-- Underline accent -->
  <rect x="720" y="280" width="160" height="3" rx="1.5" fill="url(#border-grad)"/>
  
  <!-- Agent cards row (3 example agents) -->
  <!-- Card 1 -->
  <rect x="180" y="380" width="380" height="320" rx="16" fill="#16161a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="180" y="380" width="380" height="3" rx="1.5" fill="url(#border-grad)"/>
  <circle cx="370" cy="500" r="70" fill="#1c1c22" stroke="#6b35ff" stroke-width="1" opacity="0.4"/>
  <text x="370" y="520" text-anchor="middle" font-size="40" opacity="0.3">🕸️</text>
  <text x="370" y="620" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#e8e8ed">Weaver 🕸️</text>
  <text x="370" y="650" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#8888a0">Content &amp; Strategy</text>
  <text x="370" y="680" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" font-style="italic" fill="#55556a">"Every story is a thread worth weaving."</text>
  
  <!-- Card 2 -->
  <rect x="610" y="380" width="380" height="320" rx="16" fill="#16161a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="610" y="380" width="380" height="3" rx="1.5" fill="url(#border-grad)"/>
  <circle cx="800" cy="500" r="70" fill="#1c1c22" stroke="#6b35ff" stroke-width="1" opacity="0.4"/>
  <text x="800" y="520" text-anchor="middle" font-size="40" opacity="0.3">✨</text>
  <text x="800" y="620" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#e8e8ed">Spark ✨</text>
  <text x="800" y="650" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#8888a0">Social &amp; Engagement</text>
  <text x="800" y="680" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" font-style="italic" fill="#55556a">"If it doesn't make you feel something..."</text>
  
  <!-- Card 3 -->
  <rect x="1040" y="380" width="380" height="320" rx="16" fill="#16161a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="1040" y="380" width="380" height="3" rx="1.5" fill="url(#border-grad)"/>
  <circle cx="1230" cy="500" r="70" fill="#1c1c22" stroke="#6b35ff" stroke-width="1" opacity="0.4"/>
  <text x="1230" y="520" text-anchor="middle" font-size="40" opacity="0.3">🎵</text>
  <text x="1230" y="620" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#e8e8ed">Miles 🎵</text>
  <text x="1230" y="650" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#8888a0">Music &amp; Audio</text>
  <text x="1230" y="680" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" font-style="italic" fill="#55556a">"The best tracks you feel before you hear."</text>
  
  <!-- Bottom: CC3PO branding -->
  <text x="800" y="850" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="14" font-weight="700" fill="#55556a" letter-spacing="6">CC3PO</text>
  <text x="800" y="875" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#55556a" letter-spacing="3">BUILD ONCE · RUN FOREVER · EVOLVE CONTINUOUSLY</text>
  
  <!-- Particle decorations -->
  <circle cx="100" cy="150" r="2" fill="#00d2ff" opacity="0.3"/>
  <circle cx="1500" cy="200" r="1.5" fill="#6b35ff" opacity="0.4"/>
  <circle cx="80" cy="700" r="1" fill="#FFD700" opacity="0.3"/>
  <circle cx="1520" cy="650" r="2" fill="#00d2ff" opacity="0.2"/>
  <circle cx="400" cy="850" r="1.5" fill="#6b35ff" opacity="0.3"/>
  
  <!-- Connection lines -->
  <line x1="100" y1="150" x2="1500" y2="200" stroke="#00d2ff" stroke-width="0.5" opacity="0.04"/>
  <line x1="1500" y1="200" x2="1520" y2="650" stroke="#6b35ff" stroke-width="0.5" opacity="0.03"/>
</svg>